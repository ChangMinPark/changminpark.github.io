<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="250" height="170" viewBox="0 0 250 170">
  <rect width="250" height="170" fill="#f4f1ea"/>

  <!-- monorepo cake sliced differently -->
  <rect x="40" y="40" width="170" height="100" rx="6" fill="#ffffff" stroke="#6b6458" stroke-width="2"/>
  <!-- feature slices (good) dashed green -->
  <line x1="96" y1="40" x2="96" y2="140" stroke="#2f9e44" stroke-width="3"/>
  <line x1="152" y1="40" x2="152" y2="140" stroke="#2f9e44" stroke-width="3"/>
  <!-- layer slices (debate) orange horizontal -->
  <line x1="40" y1="73" x2="210" y2="73" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="40" y1="106" x2="210" y2="106" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="6 4"/>
  <!-- gradle elephant mark -->
  <circle cx="125" cy="30" r="12" fill="#2f6fed"/>

</svg>
