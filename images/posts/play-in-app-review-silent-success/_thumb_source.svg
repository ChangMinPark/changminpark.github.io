<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="250" height="170" viewBox="0 0 250 170">
  <rect width="250" height="170" fill="#f4f1ea"/>
  <!-- phone -->
  <rect x="78" y="18" width="94" height="134" rx="12" fill="#1f1a14"/>
  <rect x="84" y="28" width="82" height="108" rx="4" fill="#faf8f4"/>
  <!-- status bar hint -->
  <rect x="110" y="22" width="30" height="4" rx="2" fill="#4a453c"/>
  <!-- review dialog card -->
  <rect x="94" y="48" width="62" height="58" rx="6" fill="#ffffff" stroke="#c9c2b6" stroke-width="1.5"/>
  <!-- Google Play triangle mark (simplified) -->
  <path d="M104 56 l10 6 -10 6 z" fill="#34a853"/>
  <circle cx="118" cy="62" r="5" fill="#4285f4"/>
  <circle cx="130" cy="62" r="5" fill="#fbbc04"/>
  <circle cx="142" cy="62" r="5" fill="#ea4335"/>
  <!-- five stars -->
  <g fill="#fbbc04" transform="translate(0,0)">
    <path d="M103 78 l2.2 4.4 4.8.7-3.5 3.4.8 4.8-4.3-2.3-4.3 2.3.8-4.8-3.5-3.4 4.8-.7z"/>
    <path d="M116 78 l2.2 4.4 4.8.7-3.5 3.4.8 4.8-4.3-2.3-4.3 2.3.8-4.8-3.5-3.4 4.8-.7z"/>
    <path d="M129 78 l2.2 4.4 4.8.7-3.5 3.4.8 4.8-4.3-2.3-4.3 2.3.8-4.8-3.5-3.4 4.8-.7z"/>
    <path d="M142 78 l2.2 4.4 4.8.7-3.5 3.4.8 4.8-4.3-2.3-4.3 2.3.8-4.8-3.5-3.4 4.8-.7z"/>
  </g>
  <!-- empty last star outline -->
  <path d="M148 78 l2.2 4.4 4.8.7-3.5 3.4.8 4.8-4.3-2.3-4.3 2.3.8-4.8-3.5-3.4 4.8-.7z" fill="none" stroke="#c9c2b6" stroke-width="1"/>
  <!-- fake buttons -->
  <rect x="100" y="92" width="24" height="8" rx="2" fill="#e9e4db"/>
  <rect x="128" y="92" width="24" height="8" rx="2" fill="#e9e4db"/>
  <!-- misleading success chip -->
  <g transform="translate(28,40)">
    <circle cx="20" cy="20" r="16" fill="#2f9e44"/>
    <path d="M12 20 l6 6 10-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- broken / crash mark over dialog -->
  <g transform="translate(168,36)">
    <circle cx="22" cy="22" r="18" fill="#c92a2a"/>
    <path d="M14 14 L30 30 M30 14 L14 30" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- crash burst lines -->
  <g stroke="#c92a2a" stroke-width="2" stroke-linecap="round">
    <line x1="175" y1="30" x2="168" y2="20"/>
    <line x1="200" y1="32" x2="210" y2="22"/>
    <line x1="208" y1="55" x2="220" y2="55"/>
    <line x1="175" y1="72" x2="165" y2="80"/>
  </g>
  <!-- home indicator -->
  <rect x="108" y="142" width="34" height="4" rx="2" fill="#4a453c"/>
</svg>
