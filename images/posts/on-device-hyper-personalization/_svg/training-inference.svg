<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#fafbfc"/>
  <text x="28" y="32" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1a2332">Training</text>
  <rect x="28" y="48" width="110" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="83" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">UI events</text>
  <text x="150" y="85" font-size="18" fill="#94a3b8">→</text>
  <rect x="170" y="48" width="130" height="70" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="235" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">+ time / location</text>
  <text x="235" y="98" text-anchor="middle" font-size="11" fill="#64748b">+ label</text>
  <text x="310" y="85" font-size="18" fill="#94a3b8">→</text>
  <rect x="330" y="48" width="130" height="70" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="395" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Secure storage</text>
  <text x="395" y="98" text-anchor="middle" font-size="11" fill="#64748b">on-device only</text>
  <text x="470" y="85" font-size="18" fill="#94a3b8">→</text>
  <rect x="490" y="48" width="130" height="70" rx="10" fill="#d1fae5" stroke="#059669"/>
  <text x="555" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Train model</text>

  <text x="28" y="200" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1a2332">Inference</text>
  <rect x="28" y="216" width="160" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="108" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Recent UI sequence</text>
  <text x="108" y="266" text-anchor="middle" font-size="11" fill="#64748b">last N actions</text>
  <text x="200" y="253" font-size="16" fill="#94a3b8">+</text>
  <rect x="220" y="216" width="130" height="70" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="285" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">time / location</text>
  <text x="360" y="253" font-size="18" fill="#94a3b8">→</text>
  <rect x="380" y="216" width="120" height="70" rx="10" fill="#d1fae5" stroke="#059669"/>
  <text x="440" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Predict</text>
  <text x="510" y="253" font-size="18" fill="#94a3b8">→</text>
  <rect x="530" y="216" width="160" height="70" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="610" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">Execute action</text>
  <text x="610" y="266" text-anchor="middle" font-size="11" fill="#c2410c">if confidence OK</text>

  <rect x="28" y="320" width="660" height="56" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="48" y="353" font-size="12" fill="#475569">Cold start: host heuristic until sequenceLength events exist. Retrain / fine-tune on a time-aware cadence as habits drift.</text>
</svg>
