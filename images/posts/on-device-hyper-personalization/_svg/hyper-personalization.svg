      <line x1="-18" y1="-6" x2="-14" y2="-6" stroke="#333" stroke-width="1.2"/>
      <line x1="-18" y1="0" x2="-14" y2="0" stroke="#333" stroke-width="1.2"/>
      <line x1="-18" y1="6" x2="-14" y2="6" stroke="#333" stroke-width="1.2"/>
      <line x1="14" y1="-6" x2="18" y2="-6" stroke="#333" stroke-width="1.2"/>
      <line x1="14" y1="0" x2="18" y2="0" stroke="#333" stroke-width="1.2"/>
      <line x1="14" y1="6" x2="18" y2="6" stroke="#333" stroke-width="1.2"/>
      <line x1="-6" y1="-18" x2="-6" y2="-14" stroke="#333" stroke-width="1.2"/>
      <line x1="0" y1="-18" x2="0" y2="-14" stroke="#333" stroke-width="1.2"/>
      <line x1="6" y1="-18" x2="6" y2="-14" stroke="#333" stroke-width="1.2"/>
      <line x1="-6" y1="14" x2="-6" y2="18" stroke="#333" stroke-width="1.2"/>
      <line x1="0" y1="14" x2="0" y2="18" stroke="#333" stroke-width="1.2"/>
      <line x1="6" y1="14" x2="6" y2="18" stroke="#333" stroke-width="1.2"/>
      <path d="M-7,-2 C-7,-8 -2,-10 0,-10 C2,-10 7,-8 7,-2 C7,4 3,8 0,8 C-3,8 -7,4 -7,-2 Z" fill="none" stroke="#222" stroke-width="1.2"/>
      <path d="M0,-10 L0,8" fill="none" stroke="#222" stroke-width="1"/>
    </g>
  </defs>
  <rect width="900" height="320" fill="#fff"/>

  <!-- User 1 -->
  <text x="95" y="28" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#222">“Read school emails”</text>
  <g transform="translate(95,55)" color="#e8c96a"><use href="#chip-sm"/></g>
  <line x1="40" y1="220" x2="150" y2="220" stroke="#999" stroke-width="1"/>
  <line x1="40" y1="100" x2="40" y2="220" stroke="#999" stroke-width="1"/>
  <polygon points="150,220 145,216 145,224" fill="#999"/>
  <polygon points="40,100 36,105 44,105" fill="#999"/>
  <circle cx="55" cy="190" r="3.5" fill="#d4a017"/>
  <circle cx="75" cy="155" r="3.5" fill="#d4a017"/>
  <circle cx="95" cy="170" r="3.5" fill="#d4a017"/>
  <circle cx="115" cy="130" r="3.5" fill="#d4a017"/>
  <circle cx="135" cy="145" r="3.5" fill="#d4a017"/>
  <path d="M50,195 C70,140 90,180 140,140" fill="none" stroke="#d4a017" stroke-width="2"/>
  <text x="95" y="250" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222">User 1</text>

  <!-- User 2 -->
  <text x="265" y="28" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#222">“Read newsletter emails”</text>
  <g transform="translate(265,55)" color="#7ec98a"><use href="#chip-sm"/></g>
