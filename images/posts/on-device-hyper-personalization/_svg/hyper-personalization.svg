  <polygon points="210,100 206,105 214,105" fill="#999"/>
  <circle cx="225" cy="200" r="3.5" fill="#2f8a4e"/>
  <circle cx="245" cy="175" r="3.5" fill="#2f8a4e"/>
  <circle cx="265" cy="155" r="3.5" fill="#2f8a4e"/>
  <circle cx="285" cy="130" r="3.5" fill="#2f8a4e"/>
  <circle cx="305" cy="110" r="3.5" fill="#2f8a4e"/>
  <path d="M220,205 C250,170 280,145 310,105" fill="none" stroke="#2f8a4e" stroke-width="2"/>
  <text x="265" y="250" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222">User 2</text>

  <!-- User 3 -->
  <text x="435" y="28" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#222">“Read social emails”</text>
