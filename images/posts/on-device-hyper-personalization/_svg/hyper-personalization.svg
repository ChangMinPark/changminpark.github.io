<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <rect width="900" height="420" fill="#fafbfc"/>
  <text x="28" y="36" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#1a2332">User behavior patterns (morning)</text>
  <!-- User 1 -->
  <rect x="28" y="56" width="200" height="150" rx="10" fill="#fff" stroke="#e8a87c" stroke-width="2"/>
  <text x="128" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#c56b2a">User 1</text>
  <text x="128" y="98" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#666">Read school emails</text>
  <polyline points="50,180 80,140 110,120 140,130 160,160 190,175" fill="none" stroke="#e8a87c" stroke-width="2.5"/>
  <circle cx="50" cy="180" r="3" fill="#e8a87c"/><circle cx="80" cy="140" r="3" fill="#e8a87c"/><circle cx="110" cy="120" r="3" fill="#e8a87c"/><circle cx="140" cy="130" r="3" fill="#e8a87c"/><circle cx="160" cy="160" r="3" fill="#e8a87c"/><circle cx="190" cy="175" r="3" fill="#e8a87c"/>
  <!-- User 2 -->
  <rect x="248" y="56" width="200" height="150" rx="10" fill="#fff" stroke="#5cb87a" stroke-width="2"/>
  <text x="348" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#2f8a4e">User 2</text>
  <text x="348" y="98" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#666">Read newsletters</text>
  <polyline points="270,185 300,170 330,155 360,140 390,125 420,110" fill="none" stroke="#5cb87a" stroke-width="2.5"/>
  <circle cx="270" cy="185" r="3" fill="#5cb87a"/><circle cx="300" cy="170" r="3" fill="#5cb87a"/><circle cx="330" cy="155" r="3" fill="#5cb87a"/><circle cx="360" cy="140" r="3" fill="#5cb87a"/><circle cx="390" cy="125" r="3" fill="#5cb87a"/><circle cx="420" cy="110" r="3" fill="#5cb87a"/>
  <!-- User 3 -->
  <rect x="468" y="56" width="200" height="150" rx="10" fill="#fff" stroke="#5b8def" stroke-width="2"/>
  <text x="568" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#2f5eb8">User 3</text>
  <text x="568" y="98" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#666">Read social emails</text>
  <polyline points="490,130 520,115 550,125 580,160 610,175 640,180" fill="none" stroke="#5b8def" stroke-width="2.5"/>
  <circle cx="490" cy="130" r="3" fill="#5b8def"/><circle cx="520" cy="115" r="3" fill="#5b8def"/><circle cx="550" cy="125" r="3" fill="#5b8def"/><circle cx="580" cy="160" r="3" fill="#5b8def"/><circle cx="610" cy="175" r="3" fill="#5b8def"/><circle cx="640" cy="180" r="3" fill="#5b8def"/>
  <!-- Arrow -->
  <path d="M700 130 L760 130" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker></defs>
  <!-- Aggregate -->
  <rect x="700" y="56" width="180" height="150" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="790" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#334155">All users (shared)</text>
  <text x="790" y="98" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#666">Averaged “read email”</text>
  <circle cx="730" cy="140" r="2.5" fill="#cbd5e1"/><circle cx="750" cy="155" r="2.5" fill="#cbd5e1"/><circle cx="770" cy="125" r="2.5" fill="#cbd5e1"/><circle cx="790" cy="145" r="2.5" fill="#cbd5e1"/><circle cx="810" cy="160" r="2.5" fill="#cbd5e1"/><circle cx="830" cy="135" r="2.5" fill="#cbd5e1"/><circle cx="850" cy="150" r="2.5" fill="#cbd5e1"/>
  <polyline points="720,165 760,140 800,135 850,150" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Bottom callout -->
  <rect x="28" y="240" width="844" height="150" rx="12" fill="#fff" stroke="#dbe3ef" stroke-width="1.5"/>
  <text x="450" y="275" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1a2332">Hyper-personalization vs shared model</text>
  <text x="60" y="310" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#334155">Dedicated model per user — keeps school / newsletter / social routines distinct.</text>
  <text x="60" y="338" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#334155">Shared model — one trend line from everyone’s data; useful to nobody’s real morning.</text>
  <text x="60" y="366" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#64748b">The library trains a small on-device model for each user from their UI sequences.</text>
</svg>
