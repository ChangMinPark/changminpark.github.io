  <circle cx="750" cy="140" r="2.5" fill="#c4c4c4"/>
  <circle cx="765" cy="155" r="2.5" fill="#c4c4c4"/>
  <circle cx="780" cy="135" r="2.5" fill="#c4c4c4"/>
  <circle cx="795" cy="170" r="2.5" fill="#c4c4c4"/>
  <circle cx="810" cy="185" r="2.5" fill="#c4c4c4"/>
  <circle cx="825" cy="160" r="2.5" fill="#c4c4c4"/>
  <circle cx="668" cy="200" r="2.5" fill="#c4c4c4"/>
  <circle cx="712" cy="190" r="2.5" fill="#c4c4c4"/>
  <circle cx="758" cy="195" r="2.5" fill="#c4c4c4"/>
  <path d="M655,195 C700,105 780,105 830,195" fill="none" stroke="#222" stroke-width="2.5"/>
