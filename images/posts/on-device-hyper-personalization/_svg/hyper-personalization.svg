  <circle cx="415" cy="130" r="3.5" fill="#2f5eb8"/>
  <circle cx="435" cy="115" r="3.5" fill="#2f5eb8"/>
  <circle cx="455" cy="145" r="3.5" fill="#2f5eb8"/>
  <circle cx="475" cy="185" r="3.5" fill="#2f5eb8"/>
  <path d="M390,175 C420,100 450,120 480,190" fill="none" stroke="#2f5eb8" stroke-width="2"/>
  <text x="435" y="250" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222">User 3</text>

  <!-- Arrow -->
  <path d="M520 160 L575 160" stroke="#9ca3af" stroke-width="10" stroke-linecap="butt"/>
  <polygon points="595,160 570,145 570,175" fill="#9ca3af"/>

  <!-- All Users -->
  <text x="740" y="28" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#222">“Read emails”</text>
  <g transform="translate(740,55)" color="#d1d5db"><use href="#chip-sm"/></g>
  <line x1="640" y1="220" x2="840" y2="220" stroke="#999" stroke-width="1"/>
  <line x1="640" y1="100" x2="640" y2="220" stroke="#999" stroke-width="1"/>
