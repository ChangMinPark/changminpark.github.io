<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520">
  <rect width="720" height="520" fill="#fff"/>

  <!-- ========== Cloud personalization ========== -->
  <!-- phones -->
  <g id="phone">
    <rect x="-12" y="-22" width="24" height="44" rx="3" fill="#fff" stroke="#222" stroke-width="1.4"/>
    <rect x="-8" y="-16" width="16" height="28" fill="none" stroke="#222" stroke-width="1"/>
    <line x1="-4" y1="16" x2="4" y2="16" stroke="#222" stroke-width="1.2"/>
  </g>

  <g transform="translate(360,55)"><use href="#phone"/></g>
  <g transform="translate(220,85)"><use href="#phone"/></g>
  <g transform="translate(500,85)"><use href="#phone"/></g>
  <g transform="translate(150,150)"><use href="#phone"/></g>
  <g transform="translate(570,150)"><use href="#phone"/></g>
  <g transform="translate(200,210)"><use href="#phone"/></g>
  <g transform="translate(520,210)"><use href="#phone"/></g>

  <!-- cloud -->
  <path d="M300,175 C290,155 310,135 340,140 C350,120 390,120 405,140 C430,135 450,155 440,175 C455,185 445,205 420,205 L320,205 C295,205 285,185 300,175 Z"
        fill="#f3f4f6" stroke="#222" stroke-width="1.5"/>
  <!-- server rack inside cloud -->
  <rect x="345" y="155" width="40" height="36" rx="2" fill="#fff" stroke="#222" stroke-width="1.2"/>
  <line x1="352" y1="165" x2="378" y2="165" stroke="#222" stroke-width="1.5"/>
  <line x1="352" y1="173" x2="378" y2="173" stroke="#222" stroke-width="1.5"/>
  <line x1="352" y1="181" x2="378" y2="181" stroke="#222" stroke-width="1.5"/>
  <circle cx="349" cy="165" r="1.2" fill="#222"/>
  <circle cx="349" cy="173" r="1.2" fill="#222"/>
  <circle cx="349" cy="181" r="1.2" fill="#222"/>

  <!-- bidirectional arrows (simplified as lines with arrowheads both ends) -->
  <line x1="360" y1="77" x2="360" y2="140" stroke="#555" stroke-width="1.2"/>
  <polygon points="360,77 356,84 364,84" fill="#555"/>
  <polygon points="360,140 356,133 364,133" fill="#555"/>

  <line x1="232" y1="100" x2="320" y2="155" stroke="#555" stroke-width="1.2"/>
  <polygon points="232,100 238,100 234,107" fill="#555"/>
  <polygon points="320,155 314,152 318,148" fill="#555"/>

  <line x1="488" y1="100" x2="410" y2="155" stroke="#555" stroke-width="1.2"/>
  <polygon points="488,100 482,100 486,107" fill="#555"/>
  <polygon points="410,155 416,152 412,148" fill="#555"/>

  <line x1="162" y1="150" x2="300" y2="175" stroke="#555" stroke-width="1.2"/>
  <polygon points="162,150 168,148 166,156" fill="#555"/>
  <polygon points="300,175 294,174 297,169" fill="#555"/>

  <line x1="558" y1="150" x2="430" y2="175" stroke="#555" stroke-width="1.2"/>
  <polygon points="558,150 552,148 554,156" fill="#555"/>
  <polygon points="430,175 436,174 433,169" fill="#555"/>

  <text x="360" y="245" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222">Cloud personalization</text>

  <!-- ========== On-device LLM ========== -->
  <!-- app icons cluster -->
  <rect x="80" y="320" width="36" height="36" rx="6" fill="#217346" stroke="#14532d"/>
  <text x="98" y="343" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">X</text>

  <circle cx="145" cy="310" r="18" fill="#f97316" stroke="#c2410c"/>
  <rect x="137" y="302" width="16" height="16" rx="2" fill="#fff" opacity="0.9"/>

  <circle cx="195" cy="340" r="18" fill="#ef4444" stroke="#b91c1c"/>
  <path d="M195,331 L195,345 M188,338 Q195,334 202,338" fill="none" stroke="#fff" stroke-width="1.8"/>

  <circle cx="145" cy="380" r="18" fill="#1d4ed8" stroke="#1e3a8a"/>
  <text x="145" y="385" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">A文</text>

  <circle cx="195" cy="400" r="18" fill="#dc2626" stroke="#991b1b"/>
  <path d="M186,398 L195,392 L204,398 L204,405 L186,405 Z" fill="#fff"/>

  <!-- wide arrow -->
  <path d="M240,360 L380,360 L380,345 L430,370 L380,395 L380,380 L240,380 Z" fill="#fff" stroke="#222" stroke-width="1.5"/>

  <!-- phone with LLM -->
  <rect x="480" y="300" width="90" height="150" rx="10" fill="#fff" stroke="#222" stroke-width="1.8"/>
  <rect x="492" y="318" width="66" height="110" fill="#f8fafc" stroke="#222" stroke-width="1"/>
  <!-- brain+circuit -->
  <path d="M510,360 C510,345 520,340 525,340 C530,340 540,345 540,360 C540,375 532,385 525,385 C518,385 510,375 510,360 Z" fill="none" stroke="#222" stroke-width="1.4"/>
  <path d="M525,340 L525,385" stroke="#222" stroke-width="1"/>
  <circle cx="505" cy="355" r="2.5" fill="#222"/>
  <circle cx="545" cy="355" r="2.5" fill="#222"/>
  <circle cx="505" cy="375" r="2.5" fill="#222"/>
  <circle cx="545" cy="375" r="2.5" fill="#222"/>
  <line x1="507" y1="355" x2="515" y2="355" stroke="#222" stroke-width="1"/>
  <line x1="535" y1="355" x2="543" y2="355" stroke="#222" stroke-width="1"/>
  <line x1="507" y1="375" x2="515" y2="375" stroke="#222" stroke-width="1"/>
  <line x1="535" y1="375" x2="543" y2="375" stroke="#222" stroke-width="1"/>
  <rect x="500" y="348" width="50" height="44" fill="none" stroke="#222" stroke-width="1" stroke-dasharray="2 2"/>

  <text x="360" y="490" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222">On-device general LLMs</text>
</svg>
