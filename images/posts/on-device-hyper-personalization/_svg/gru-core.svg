<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="#555"/>
    </marker>
  </defs>
  <rect width="560" height="300" fill="#fff"/>

  <!-- Task heads -->
  <rect x="40" y="28" width="160" height="52" fill="#fff" stroke="#333" stroke-width="1.1"/>
  <text x="120" y="59" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#222">Task head A</text>

  <rect x="360" y="28" width="160" height="52" fill="#fff" stroke="#333" stroke-width="1.1"/>
  <text x="440" y="59" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#222">Task head B</text>

  <line x1="120" y1="80" x2="240" y2="140" stroke="#555" stroke-width="1.1"/>
  <line x1="440" y1="80" x2="320" y2="140" stroke="#555" stroke-width="1.1"/>

  <!-- Shared encoder -->
  <circle cx="280" cy="170" r="58" fill="#f4f4f4" stroke="#333" stroke-width="1.3"/>
  <text x="280" y="166" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222">Shared</text>
  <text x="280" y="186" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#222">encoder</text>

  <line x1="280" y1="228" x2="280" y2="248" stroke="#555" stroke-width="1.1" marker-end="url(#arr)"/>

  <rect x="180" y="248" width="200" height="36" fill="#fff" stroke="#333" stroke-width="1.1"/>
  <text x="280" y="271" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#222">User encoding</text>
</svg>
