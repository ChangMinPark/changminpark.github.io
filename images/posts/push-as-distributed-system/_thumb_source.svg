<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="250" height="170" viewBox="0 0 250 170">
  <!-- Push pipeline: event → policy → queue → providers → device -->
  <rect width="250" height="170" fill="#fff7ed"/>
  <!-- left accent strip -->
  <rect width="8" height="170" fill="#ea580c"/>

  <text x="22" y="22" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#9a3412" letter-spacing="1.5">PUSH PIPELINE</text>

  <!-- Stage boxes -->
  <rect x="18" y="38" width="52" height="36" rx="6" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
  <text x="44" y="54" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#9a3412">event</text>
  <text x="44" y="66" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#ea580c">mail</text>

  <path d="M72 56 H84" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arr)"/>
  <polygon points="82,52 90,56 82,60" fill="#c2410c"/>

  <rect x="92" y="38" width="58" height="36" rx="6" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
  <text x="121" y="54" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#9a3412">policy</text>
  <text x="121" y="66" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="7.5" fill="#ea580c">collapse·pri</text>

  <path d="M152 56 H162" stroke="#c2410c" stroke-width="1.5"/>
  <polygon points="160,52 168,56 160,60" fill="#c2410c"/>

  <rect x="170" y="38" width="62" height="36" rx="6" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
  <text x="201" y="54" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#9a3412">queue</text>
  <text x="201" y="66" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#ea580c">retry</text>

  <!-- Providers fan-out -->
  <path d="M201 74 V88" stroke="#c2410c" stroke-width="1.5"/>
  <path d="M120 88 H201" stroke="#c2410c" stroke-width="1.5" fill="none"/>
  <path d="M120 88 V98" stroke="#c2410c" stroke-width="1.5"/>
  <path d="M201 88 V98" stroke="#c2410c" stroke-width="1.5"/>

  <rect x="88" y="100" width="64" height="28" rx="5" fill="#1e293b"/>
  <text x="120" y="118" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="700" fill="#f8fafc">FCM</text>

  <rect x="168" y="100" width="64" height="28" rx="5" fill="#1e293b"/>
  <text x="200" y="118" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="700" fill="#93c5fd">APNs</text>

  <!-- Device -->
  <path d="M120 128 V138" stroke="#c2410c" stroke-width="1.5"/>
  <path d="M200 128 V138" stroke="#c2410c" stroke-width="1.5"/>
  <path d="M120 138 H200" stroke="#c2410c" stroke-width="1.5"/>
  <path d="M160 138 V146" stroke="#c2410c" stroke-width="1.5"/>

  <rect x="118" y="146" width="84" height="16" rx="4" fill="#ea580c"/>
  <text x="160" y="157" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#fff">device</text>
</svg>
