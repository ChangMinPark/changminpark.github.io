<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="250" height="170" viewBox="0 0 250 170">
  <rect width="250" height="170" fill="#f4f1ea"/>

  <!-- phone -->
  <rect x="20" y="22" width="70" height="126" rx="10" fill="#1f1a14"/>
  <rect x="26" y="32" width="58" height="100" rx="3" fill="#faf8f4"/>
  <rect x="42" y="26" width="26" height="3" rx="1.5" fill="#4a453c"/>
  <!-- three signal streams from phone -->
  <!-- crash (red, noisy) -->
  <path d="M90 50 C120 40 130 70 160 55" fill="none" stroke="#c92a2a" stroke-width="3"/>
  <rect x="160" y="40" width="70" height="28" rx="4" fill="#c92a2a" opacity="0.9"/>
  <line x1="170" y1="50" x2="218" y2="50" stroke="#fff" stroke-width="2"/>
  <line x1="170" y1="58" x2="205" y2="58" stroke="#fff" stroke-width="2"/>
  <!-- logs (muted flood) -->
  <path d="M90 85 C125 85 135 100 160 95" fill="none" stroke="#6b6458" stroke-width="3"/>
  <g fill="#e9e4db" stroke="#6b6458" stroke-width="1">
    <rect x="160" y="82" width="70" height="8" rx="2"/>
    <rect x="160" y="94" width="70" height="8" rx="2"/>
    <rect x="160" y="106" width="55" height="8" rx="2"/>
  </g>
  <!-- metrics (chosen / deciding) -->
  <path d="M90 120 C120 130 140 125 160 128" fill="none" stroke="#2f6fed" stroke-width="4"/>
  <rect x="160" y="118" width="70" height="32" rx="4" fill="#2f6fed"/>
  <!-- mini gauge -->
  <circle cx="182" cy="134" r="10" fill="none" stroke="#fff" stroke-width="2"/>
  <path d="M182 134 L188 128" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <rect x="198" y="126" width="8" height="16" rx="1" fill="#fff" opacity="0.85"/>
  <rect x="210" y="122" width="8" height="20" rx="1" fill="#fff"/>
  <!-- highlight ring on metrics = pick signals that decide -->
  <circle cx="195" cy="134" r="22" fill="none" stroke="#2f9e44" stroke-width="2.5"/>

</svg>
