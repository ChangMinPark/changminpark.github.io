<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <rect width="1200" height="540" fill="#0e1116"/>
  
  <text x="600" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e8eaef">Same screenshot. Different control.</text>
  <!-- left phone: Material Button -->
  <text x="300" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9aa3b2">Button( ) — role comes for free</text>
  
  <rect x="190" y="96" width="220" height="360" rx="28" fill="#0b0d12" stroke="#3a4250" stroke-width="2"/>
  <rect x="200" y="106" width="200" height="340" rx="20" fill="#12151c"/>
  <rect x="272.0" y="112" width="56" height="8" rx="4" fill="#1a1f28"/>

  <rect x="214" y="200" width="172" height="52" rx="26" fill="#6750A4"/>
  <text x="300" y="232" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Send</text>
  <rect x="214" y="280" width="172" height="70" rx="10" fill="#1c2430" stroke="#3DDC84"/>
  <text x="300" y="308" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3DDC84">TalkBack</text>
  <text x="300" y="328" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#e8eaef">“Send. Button.”</text>
  <!-- right phone: clickable text -->
  <text x="900" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9aa3b2">Text + clickable — looks identical</text>
  
  <rect x="790" y="96" width="220" height="360" rx="28" fill="#0b0d12" stroke="#3a4250" stroke-width="2"/>
  <rect x="800" y="106" width="200" height="340" rx="20" fill="#12151c"/>
  <rect x="872.0" y="112" width="56" height="8" rx="4" fill="#1a1f28"/>

  <rect x="814" y="200" width="172" height="52" rx="26" fill="#6750A4"/>
  <text x="900" y="232" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Send</text>
  <rect x="814" y="280" width="172" height="70" rx="10" fill="#1c2430" stroke="#c23b2e"/>
  <text x="900" y="308" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#f0b0a8">TalkBack</text>
  <text x="900" y="328" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#e8eaef">“Send.”</text>
  <text x="600" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c9a227">The purple pill is skeuomorphism-as-affordance. The spoken role is the actual API.</text>

</svg>
