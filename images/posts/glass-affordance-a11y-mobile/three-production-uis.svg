<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <rect width="1200" height="540" fill="#0e1116"/>
  
  <text x="600" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e8eaef">Design review sees one UI. Production has three.</text>
  <!-- three columns as cards -->
  <rect x="40" y="70" width="350" height="430" rx="16" fill="#161b22" stroke="#2c3440"/>
  <rect x="425" y="70" width="350" height="430" rx="16" fill="#161b22" stroke="#2c3440"/>
  <rect x="810" y="70" width="350" height="430" rx="16" fill="#161b22" stroke="#2c3440"/>
  <text x="215" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8eaef">1 · Default pixels</text>
  <text x="600" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8eaef">2 · Flattened a11y</text>
  <text x="985" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8eaef">3 · Spoken tree</text>
  <text x="215" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b93a1">Figma · default simulator</text>
  <text x="600" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b93a1">Reduce Transparency · high contrast</text>
  <text x="985" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b93a1">TalkBack · VoiceOver · Switch</text>
  <!-- mini UIs -->
  <rect x="90" y="170" width="210" height="280" rx="18" fill="#e8eef8"/>
  <rect x="100" y="380" width="190" height="55" rx="14" fill="#fff" fill-opacity="0.55" stroke="#fff"/>
  <text x="215" y="412" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a2740">glass chrome</text>
  <rect x="475" y="170" width="210" height="280" rx="18" fill="#ececec"/>
  <rect x="485" y="380" width="190" height="55" rx="8" fill="#d9d9d9" stroke="#aaa"/>
  <text x="600" y="412" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333">opaque bar</text>
  <rect x="860" y="170" width="210" height="280" rx="18" fill="#111"/>
  <rect x="870" y="250" width="190" height="70" rx="8" fill="#1a2a14" stroke="#C5E1A5" stroke-width="3"/>
  <text x="965" y="280" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#C5E1A5">Compose</text>
  <text x="965" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9cba7a">Button · double-tap</text>
  <text x="215" y="475" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d7584">If tap-target = glass look,</text>
  <text x="600" y="475" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d7584">that cue is gone here.</text>
  <text x="985" y="475" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d7584">Only the tree remains.</text>

</svg>
