<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="250" height="170" viewBox="0 0 250 170">
  <!-- Feature flags: kill / rollout / experiment as UI controls, not text cards -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="250" height="170" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#334155" stroke-width="0.6" opacity="0.45">
    <path d="M0 42 H250 M0 84 H250 M0 126 H250"/>
    <path d="M62 0 V170 M125 0 V170 M188 0 V170"/>
  </g>

  <!-- Kill switch row -->
  <text x="16" y="28" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1.2">KILL</text>
  <rect x="70" y="14" width="164" height="22" rx="11" fill="#3f1d1d"/>
  <circle cx="88" cy="25" r="8" fill="#ef4444"/>
  <text x="108" y="29" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#fecaca">OFF · safe default</text>

  <!-- Rollout row -->
  <text x="16" y="78" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1.2">ROLL</text>
  <rect x="70" y="62" width="164" height="22" rx="6" fill="#1e3a5f"/>
  <rect x="70" y="62" width="92" height="22" rx="6" fill="#2563eb"/>
  <text x="78" y="77" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#dbeafe">37% sticky</text>
  <text x="198" y="77" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#64748b">100</text>

  <!-- Experiment row -->
  <text x="16" y="128" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1.2">EXP</text>
  <rect x="70" y="110" width="78" height="40" rx="7" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="109" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#86efac">A</text>
  <text x="109" y="142" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="8" fill="#86efac">control</text>
  <rect x="156" y="110" width="78" height="40" rx="7" fill="#3b2f14" stroke="#eab308" stroke-width="1.5"/>
  <text x="195" y="128" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#fde047">B</text>
  <text x="195" y="142" text-anchor="middle" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="8" fill="#fde047">treatment</text>
</svg>
